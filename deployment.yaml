apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplewebapp
  namespace: simplewebapp
spec:
  replicas: 2

  selector:
    matchLabels:
      app: simplewebapp

  template:
    metadata:
      labels:
        app: simplewebapp

    spec:
      containers:
      - name: simplewebapp

        image: gkoloven-significa:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"

        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: simplewebapp-config
              key: APP_MESSAGE

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
